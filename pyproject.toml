[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teamkit-codex"
version = "1.0.0"
description = "Local-first Codex multi-agent project adapters and deterministic task orchestration"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "TeamKit Contributors"}]
dependencies = []

[project.scripts]
teamkit = "teamkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
teamkit = ["assets/agents/*.toml", "assets/skills/*/SKILL.md", "assets/sources.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
