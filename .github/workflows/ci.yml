name: CI
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e . pytest tomli pillow
      - run: python -m pytest -q
      - run: teamkit --help
      - name: Verify the installable wheel includes complete Skill references
        run: |
          python -m pip install build
          python -m build --wheel
          python - <<'PY'
          import glob, zipfile
          files=glob.glob('dist/*.whl')
          assert len(files)==1, files
          with zipfile.ZipFile(files[0]) as wheel:
              names=wheel.namelist()
              expected=('teamkit/assets/skills/swiftui-pro/SKILL.md',
                        'teamkit/assets/skills/swiftui-pro/LICENSE',
                        'teamkit/assets/skills/swiftui-pro/references/navigation.md')
              for item in expected:
                  assert item in names, (item,names)
          print('Full mature skill bundle packaged:', files[0])
          PY
